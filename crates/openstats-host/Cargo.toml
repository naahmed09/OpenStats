[package]
name = "openstats-host"
description = "OpenStats host bindings (std only): a flat C ABI over the workspace for WebAssembly and native shells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openstats-core = { workspace = true }
openstats-charts = { workspace = true }
openstats-stats = { workspace = true }
openstats-ui = { workspace = true }

[lints.rust]
# The only `unsafe_code` is the `#[no_mangle]` attribute of the C ABI in `abi.rs`, which allows it
# locally; there are no `unsafe` blocks anywhere (buffers cross the boundary through
# host-owned `Vec`s, see `Host::reserve_input`).
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
float_cmp = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
excessive_precision = "allow"
