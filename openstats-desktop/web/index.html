<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenStats</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dadada; }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* The UI is drawn on a canvas: the browser must never treat it as selectable page content
     (a right- or double-click would otherwise tint the whole window with the selection colour). */
  html, body, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas::selection, body::selection { background: transparent; }
  .openstats-print canvas { width: auto; height: auto; page-break-after: always; }
  @media screen { .openstats-print { display: none; } }
  @media print { body > :not(.openstats-print) { display: none !important; } }
</style>
</head>
<body>
<canvas id="app"></canvas>
<script type="module">
  import { OpenStats, browserHandlers } from './openstats.js';
  let app, publishMenu = () => {};
  const T = window.__TAURI__; // present only inside the Tauri shell
  const canvas = document.getElementById('app');
  const handlers = T
    ? { ...(await import('./tauri-shell.js')).tauriHandlers(T, () => app), onFrame: () => publishMenu() }
    : {
        ...browserHandlers(() => app),
        onTearOff: ({ name, json }) => {
          const w = window.open('./graph.html', '_blank', 'width=720,height=480');
          if (w) w.addEventListener('load', () => w.postMessage({ name, json }, '*'));
        },
      };
  app = await OpenStats.load('./openstats_host.wasm', canvas, handlers);
  if (T) publishMenu = await (await import('./tauri-shell.js')).installNativeMenu(T, app);
  const resize = () => app.fit(window.innerWidth, window.innerHeight, window.devicePixelRatio || 1);
  window.addEventListener('resize', resize);
  resize();
  app.focusInput();
</script>
</body>
</html>
